name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Use the runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set version code from run number
        run: node -e "const j=require('./app.json');j.expo.android.versionCode=${{ github.run_number }};require('fs').writeFileSync('app.json',JSON.stringify(j,null,2))"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk tarmac-riot-${{ github.run_number }}.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarmac-riot-apk
          path: tarmac-riot-${{ github.run_number }}.apk

      - name: Publish as a GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tarmac Riot build ${{ github.run_number }}
          files: tarmac-riot-${{ github.run_number }}.apk
          prerelease: true
