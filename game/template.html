<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Tarmac Riot</title>
<style>
:root{--o:#ff6a00;--y:#ffd400;--card:#161a23;--card2:#1f2531;--ink:#fff;--mut:#a3adbb;--font:"Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;background:#000}
canvas#c,canvas#c3{position:absolute;inset:0;width:100%;height:100%;display:block}
#loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2vh;background:rgba(6,8,12,.92);color:var(--y);font:italic 900 6vh var(--font);z-index:15;letter-spacing:.1em}
#loading.on{display:flex}
#loading .spin{width:9vh;height:9vh;border-radius:50%;border:1vh solid #2a303d;border-top-color:var(--o);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ui{position:absolute;inset:0;pointer-events:none}
#ui .scr{pointer-events:auto}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(2.5vh,env(safe-area-inset-top)) max(3vw,env(safe-area-inset-right)) max(2.5vh,env(safe-area-inset-bottom)) max(3vw,env(safe-area-inset-left))}
.dimL{background:linear-gradient(90deg,rgba(5,6,10,.9),rgba(5,6,10,.55) 45%,rgba(5,6,10,0) 75%)}
.dimA{background:rgba(6,8,12,.86)}
.center{align-items:center;justify-content:center}
.menu{display:flex;flex-direction:column;justify-content:center;height:100%;gap:5vh}
.logo{transform:skew(-10deg);line-height:.82}
.l1,.l2{font-weight:900;font-style:italic;font-size:17vh;letter-spacing:-.02em}
.l1{color:#fff;text-shadow:0 .8vh 0 rgba(0,0,0,.5)}
.l2{color:var(--o);text-shadow:0 .8vh 0 #7a2d00}
.tag{margin-top:2vh;font-size:3.6vh;color:var(--y);font-weight:800;font-style:italic;letter-spacing:.06em}
.mbtns{display:flex;flex-direction:column;align-items:flex-start;gap:2vh}
.btn{font:italic 900 4.2vh var(--font);padding:1.4vh 3.6vh;background:var(--o);color:#111;border:0;border-radius:1vh;transform:skew(-8deg);box-shadow:0 .7vh 0 #9c3c00;cursor:pointer;letter-spacing:.02em;white-space:nowrap}
.btn:active{transform:skew(-8deg) translateY(.5vh);box-shadow:0 .2vh 0 #9c3c00}
.btn.big{font-size:6.4vh;padding:1.6vh 7vh;background:var(--y);box-shadow:0 .8vh 0 #a88a00}
.btn.ghost{background:#2a303d;color:#fff;box-shadow:0 .7vh 0 #11141a}
.btn.small{font-size:3.2vh;padding:1vh 2.6vh}
.btn.danger{background:#d93636;color:#fff;box-shadow:0 .7vh 0 #7a1717}
.btn[disabled]{opacity:.45}
.topr{position:absolute;top:max(2.5vh,env(safe-area-inset-top));right:max(3vw,env(safe-area-inset-right));display:flex;gap:1.6vh;align-items:center}
.ico{width:9vh;height:9vh;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:4.4vh;cursor:pointer}
.chip{background:rgba(0,0,0,.6);border:.3vh solid #2fe08a;color:#7CFFB2;font-weight:900;font-style:italic;font-size:3.6vh;padding:.8vh 2.2vh;border-radius:5vh;white-space:nowrap}
.head{display:flex;align-items:center;gap:3vh;margin-bottom:2.5vh}
.head h2{flex:1;margin:0;font-size:6vh;font-weight:900;font-style:italic;color:var(--y)}
.cards{flex:1;display:flex;gap:2.4vh;overflow-x:auto;padding-bottom:1vh;touch-action:pan-x}
.card{position:relative;min-width:42vh;flex:1;display:flex;flex-direction:column;text-align:left;gap:.8vh;background:var(--card);border:.4vh solid #2a303d;border-radius:2vh;padding:1.6vh;color:#fff;font-family:var(--font);cursor:pointer}
.card:active{border-color:var(--o)}
.card .thumb{height:20vh;border-radius:1.2vh}
.card b{font-size:4vh;font-style:italic;font-weight:900}
.card small{font-size:2.8vh;color:var(--mut)}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:2.8vh;color:var(--y);margin-top:auto}
.card.lock{opacity:.55}
.lockmsg{position:absolute;left:1.6vh;right:1.6vh;top:8vh;background:rgba(0,0,0,.75);padding:1vh;border-radius:1vh;font-size:2.8vh;text-align:center}
.dots{display:inline-flex;gap:.7vh}.dots i{width:2vh;height:2vh;border-radius:50%;background:#3a4150;display:inline-block}.dots i.on{background:var(--o)}
.foot{display:flex;align-items:center;gap:2vh;font-size:3.4vh;margin-top:2vh}
.garage{flex:1;display:flex;gap:3vh;min-height:0}
.blist{display:flex;flex-direction:column;gap:1.6vh;width:34%;overflow-y:auto}
.bk{background:var(--card);border:.4vh solid #2a303d;border-radius:1.4vh;padding:1.6vh 2vh;text-align:left;color:#fff;font-family:var(--font);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.bk b{font-size:3.6vh;font-style:italic}.bk small{font-size:2.6vh;color:var(--y)}
.bk.sel{border-color:var(--o);background:var(--card2)}
.bdet{flex:1;background:var(--card);border-radius:2vh;padding:2vh 3vh;overflow-y:auto}
.bdet h3{margin:0;font-size:5vh;font-style:italic;color:var(--o)}.bdet p{margin:.4vh 0 1.6vh;color:var(--mut);font-size:3vh}
.stat{display:flex;align-items:center;gap:2vh;font-size:2.8vh;margin:.8vh 0}.stat span{width:24vh;color:var(--mut)}
.bar{flex:1;height:1.8vh;background:#2a303d;border-radius:1vh;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--y))}
.ups{margin-top:2vh;display:flex;flex-direction:column;gap:1.2vh}
.up{display:flex;align-items:center;gap:2vh;background:var(--card2);padding:1.2vh 1.6vh;border-radius:1.2vh}.up>div{flex:1}.up b{font-size:3.2vh}.up small{display:block;color:var(--mut);font-size:2.4vh}
.act{margin-top:2.4vh}
.set{flex:1;display:flex;flex-direction:column;gap:2vh;max-width:120vh;overflow-y:auto}
.set .row{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:1.6vh 2.4vh;border-radius:1.4vh;font-size:3.4vh;gap:2vh}
.how{background:var(--card);padding:1.6vh 2.4vh;border-radius:1.4vh;font-size:3vh;color:#d6dbe3}.how p{margin:1vh 0}
.res{margin:auto;text-align:center;width:min(100%,110vh)}
.rtitle{font-size:6vh;font-weight:900;font-style:italic;color:var(--y)}
.rsub{color:var(--mut);font-size:3vh}
.place{font-size:17vh;font-weight:900;font-style:italic;line-height:1;color:#fff}.place.win{color:var(--o)}
.rls{display:grid;grid-template-columns:1fr 1fr;gap:.6vh 4vh;margin:2vh auto;max-width:90vh;text-align:left;font-size:3.2vh}
.rl{display:flex;justify-content:space-between;border-bottom:.2vh solid #2a303d;padding:.4vh 0}.rl span{color:var(--mut)}.rl.bad b{color:#ff6b6b}.rl.tot{grid-column:1/3;font-size:4.2vh}.rl.tot b{color:#7CFFB2}
.unl{background:#1d3b2a;color:#7CFFB2;border-radius:1vh;padding:1vh;font-size:3.2vh;margin-bottom:2vh}
.rbtns{display:flex;gap:2vh;justify-content:center;flex-wrap:wrap}
.pbox{display:flex;flex-direction:column;align-items:center;gap:2.6vh}
#controls{position:absolute;inset:0;pointer-events:none;display:none}
.cb{position:absolute;pointer-events:auto;touch-action:none;border:.4vh solid rgba(255,255,255,.28);background:rgba(10,12,18,.26);color:#fff;font:italic 900 4vh var(--font);border-radius:2.6vh;display:flex;align-items:center;justify-content:center;flex-direction:column;-webkit-user-select:none;user-select:none;padding:0;text-shadow:0 .3vh .6vh rgba(0,0,0,.6)}
.cb.on{background:rgba(255,106,0,.6);border-color:#fff}
.cb small{font-size:2.3vh;opacity:.85}
#bL,#bR{bottom:max(3vh,env(safe-area-inset-bottom));width:21vh;height:21vh;font-size:7.5vh}
#bL{left:max(2.5vw,env(safe-area-inset-left))}
#bR{left:calc(max(2.5vw,env(safe-area-inset-left)) + 23vh)}
#bPR,#bK,#bPL{bottom:max(3vh,env(safe-area-inset-bottom));width:18vh;height:18vh;font-size:6.4vh}
#bPR{right:max(2.5vw,env(safe-area-inset-right))}
#bK{right:calc(max(2.5vw,env(safe-area-inset-right)) + 20vh);border-color:rgba(255,212,0,.55)}
#bK.on{background:rgba(255,212,0,.6)}
#bPL{right:calc(max(2.5vw,env(safe-area-inset-right)) + 40vh)}
#bN{right:max(2.5vw,env(safe-area-inset-right));bottom:calc(max(3vh,env(safe-area-inset-bottom)) + 20vh);width:18vh;height:18vh;border-radius:50%;border-color:rgba(70,168,255,.75);color:#bfe1ff;font-size:3.4vh}
#bN.on{background:rgba(70,168,255,.7);color:#fff}
#bB{right:calc(max(2.5vw,env(safe-area-inset-right)) + 20vh);bottom:calc(max(3vh,env(safe-area-inset-bottom)) + 20vh);width:38vh;height:11vh;font-size:3.4vh;border-radius:2vh}
#bP{position:absolute;pointer-events:auto;top:max(2.5vh,env(safe-area-inset-top));right:max(1.5vw,env(safe-area-inset-right));width:9vh;height:9vh;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:3.4vh}
#rot{position:fixed;inset:0;background:#0b0d12;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;font:italic 900 22px var(--font);color:var(--y);z-index:20;text-align:center;padding:24px}
#rot .ph{width:46px;height:78px;border:4px solid #fff;border-radius:9px;animation:r 1.6s ease-in-out infinite}
@keyframes r{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#toast{position:absolute;left:50%;top:14vh;transform:translate(-50%,-2vh);background:rgba(0,0,0,.85);color:#fff;font:italic 900 3.6vh var(--font);padding:1.2vh 3vh;border-radius:4vh;opacity:0;transition:.2s;pointer-events:none;z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <canvas id="c3" width="960" height="540"></canvas>
  <canvas id="c" width="960" height="540"></canvas>
  <div id="loading"><div class="spin"></div>LOADING</div>
  <div id="controls">
    <button class="cb" id="bL" aria-label="Steer left">&#9664;</button>
    <button class="cb" id="bR" aria-label="Steer right">&#9654;</button>
    <button class="cb" id="bB" aria-label="Brake">BRAKE</button>
    <button class="cb" id="bN" aria-label="Nitro">NITRO</button>
    <button class="cb" id="bPL" aria-label="Punch left">&#128074;<small>LEFT</small></button>
    <button class="cb" id="bK" aria-label="Kick">&#129462;<small>KICK</small></button>
    <button class="cb" id="bPR" aria-label="Punch right">&#128074;<small>RIGHT</small></button>
    <button id="bP" aria-label="Pause">&#10074;&#10074;</button>
  </div>
  <div id="ui"></div>
  <div id="toast"></div>
  <div id="rot"><div class="ph"></div>Turn your phone sideways to ride</div>
</div>
<script>
/*THREE*/
</script>
<script>
/*GAME*/
</script>
<script>(function () { var go = function () { if (!window.__TR) window.TarmacRiot.boot(); }; if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go(); })();</script>
</body>
</html>
